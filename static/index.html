<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>个人成长面板</title>
  <link rel="stylesheet" href="style.css?v=20261113-without-schedule1">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🌱</span><span>个人成长面板</span></div>
    <nav id="nav">
      <button data-view="dashboard" class="active"><span class="nav-ico">☀️</span>今日</button>
      <button data-view="course"><span class="nav-ico">📚</span>课程</button>
      <button data-view="finance"><span class="nav-ico">💰</span>记账</button>
      <button data-view="deadline"><span class="nav-ico">🎯</span>DDL</button>
      <button data-view="review"><span class="nav-ico">📝</span>回顾</button>
    </nav>
    <div class="sidebar-foot"><span id="saveStatus">加载中…</span></div>
  </aside>

  <main>
    <header class="topbar">
      <h1 id="viewTitle">今日</h1>
      <div class="topbar-actions">
        <button class="sync-badge" id="syncBadge" title="同步设置" aria-label="打开同步设置">加载中</button>
        <button class="icon-btn" id="themeBtn" title="深色 / 浅色">🌙</button>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
      </div>
    </header>

    <section id="view-dashboard" class="view active">
      <div class="hero">
        <div>
          <div class="hero-hi" id="dashGreeting">你好</div>
          <div class="hero-sub muted" id="dashSub"></div>
        </div>
        <div class="hero-clock">
          <div class="clock-time" id="clockTime">--:--:--</div>
          <div class="clock-sub muted" id="clockSub"></div>
        </div>
        <div class="hero-actions">
          <button class="btn" data-modal="deadline">＋ DDL</button>
          <button class="btn" data-modal="trans">＋ 记账</button>
        </div>
      </div>
      <div id="dashStats" class="stats-grid stats-2"></div>
      <div id="dashDdl"></div>
      <div class="dash-grid">
        <div class="panel"><div class="panel-head"><h3>💰 今日收支</h3></div><div id="dashFinance"></div></div>
        <div class="panel"><div class="panel-head"><h3>📚 今日课程</h3></div><div id="dashCourses"></div></div>
      </div>
    </section>

    <section id="view-course" class="view">
      <div class="page-head">
        <input id="courseSearch" class="search" placeholder="🔍 搜索课程 / 知识点 / 问题…">
        <div class="flex1"></div>
        <button class="btn primary" data-modal="course">＋ 新建课程</button>
      </div>
      <div id="subjectGrid" class="subject-grid"></div>
    </section>

    <section id="view-finance" class="view">
      <div class="page-head">
        <input type="month" id="financeMonth" class="w160">
        <div class="flex1"></div>
        <button class="btn" id="csvBtn">⬇️ CSV</button>
        <button class="btn primary" data-modal="trans">＋ 记一笔</button>
      </div>
      <div id="financeStats" class="stats-grid"></div>
      <div class="grid-2">
        <div class="panel"><div class="panel-head"><h3>分类占比</h3></div><div id="financePie" class="pie-wrap"></div></div>
        <div class="panel"><div class="panel-head"><h3>每日支出 <span class="muted small-text">蓝 = 主账本 · 橙 = 旅行</span></h3></div><div id="financeBars" class="bars-wrap"></div></div>
      </div>
      <div id="tripPanel"></div>
      <div id="transList"></div>
    </section>

    <section id="view-deadline" class="view">
      <div class="page-head">
        <div class="muted" id="ddlStats"></div>
        <div class="flex1"></div>
        <button class="btn primary" data-modal="deadline">＋ 添加 DDL</button>
      </div>
      <div id="ddlList"></div>
    </section>

    <section id="view-review" class="view">
      <div class="tabs big" id="reviewTabs">
        <button data-rtab="daily" class="active">🌙 每日回顾</button>
        <button data-rtab="weekly">📊 周报统计</button>
      </div>

      <div id="reviewDaily">
        <div class="panel">
          <div class="toolbar tight">
            <input type="date" id="reviewDate" class="w160">
            <button class="btn" id="reviewGenBtn">🔄 生成</button>
            <button class="btn primary" id="reviewSaveBtn">💾 保存</button>
            <button class="btn" id="reviewCopyBtn">📋 复制</button>
            <div class="flex1"></div>
            <span class="muted" id="reviewSavedHint"></span>
          </div>
          <p class="muted small-text">自动汇总当天数据后可自由编辑，保存后按日期留存。</p>
          <textarea id="reviewOutput" rows="16" placeholder="选择日期 → 生成 → 编辑 → 保存"></textarea>
        </div>
      </div>

      <div id="reviewWeekly" hidden>
        <div class="toolbar">
          <button class="btn" id="weekPrevBtn">← 上一周</button>
          <div id="weekLabel" class="week-label"></div>
          <button class="btn" id="weekNextBtn">下一周 →</button>
        </div>
        <div id="weeklyContent"></div>
      </div>
    </section>
  </main>
</div>

<nav id="bottomNav" class="bottom-nav" aria-label="主导航"></nav>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose" title="关闭" aria-label="关闭弹窗">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="sync-core.js?v=20261113-without-schedule1" defer></script>
<script src="sync-client.js?v=20261113-without-schedule1" defer></script>
<script src="sync-ui.js?v=20261113-without-schedule1" defer></script>
<script src="app.js?v=20261113-without-schedule1" defer></script>
</body>
</html>
